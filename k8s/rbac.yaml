apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-reader
  namespace: app
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-reader-binding
  namespace: app
subjects:
- kind: ServiceAccount
  name: backend-sa
  namespace: app
roleRef:
  kind: Role
  name: backend-reader
  apiGroup: rbac.authorization.k8s.io
